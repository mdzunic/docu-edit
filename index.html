<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docu-edit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No-flash theme (SPEC-059 AC-5/57/58/59): the ONLY application logic in
         index.html. Runs before the app bundle and sets data-theme on <html>
         from the stored preference so the first paint is the right theme. Only
         an explicit "light"/"dark" is applied; "system" (or absent/unknown)
         leaves no attribute so the media query alone decides (AC-6). Wrapped
         so a blocked localStorage (private mode, SPEC-003) never throws.
         SPEC-066 folds the theme into docu-edit:preferences; this reads that
         first and falls back to the pre-migration docu-edit:theme key so a
         user upgrading (whose legacy key the app has not yet migrated) still
         gets a flash-free first paint. -->
    <script>
      try {
        var t = null;
        var raw = localStorage.getItem("docu-edit:preferences");
        if (raw) {
          try {
            t = JSON.parse(raw).theme;
          } catch (parseError) {}
        }
        if (t !== "light" && t !== "dark") {
          t = localStorage.getItem("docu-edit:theme");
        }
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
