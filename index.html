<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docu-edit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The design themes' faces (Modernist: Archivo, Nocturne: Inter).
         Loaded non-blocking (media="print" until loaded) with display=swap,
         so a slow or absent network never delays first paint: the --font-ui
         stacks in tokens.css fall back to the system grotesque. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- No-flash theme (SPEC-059 AC-5/57/58/59): the ONLY application logic in
         index.html. Runs before the app bundle and sets data-theme (and the
         design theme's data-palette) on <html> from the stored preference so
         the first paint is the right theme. Only an explicit "light"/"dark" is
         applied; "system" (or absent/unknown) leaves no attribute so the media
         query alone decides (AC-6) — and only a non-default palette is
         applied, so Modernist (the base :root palette) leaves no attribute
         either. Wrapped so a blocked localStorage (private mode, SPEC-003)
         never throws. SPEC-066 folds the theme into docu-edit:preferences;
         this reads that first and falls back to the pre-migration
         docu-edit:theme key so a user upgrading (whose legacy key the app has
         not yet migrated) still gets a flash-free first paint. -->
    <script>
      try {
        var t = null;
        var p = null;
        var raw = localStorage.getItem("docu-edit:preferences");
        if (raw) {
          try {
            var prefs = JSON.parse(raw);
            t = prefs.theme;
            p = prefs.palette;
          } catch (parseError) {}
        }
        if (t !== "light" && t !== "dark") {
          t = localStorage.getItem("docu-edit:theme");
        }
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
        if (typeof p === "string" && p !== "modernist" && /^[a-z-]+$/.test(p)) {
          document.documentElement.setAttribute("data-palette", p);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
