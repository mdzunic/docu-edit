<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy (SEC-6). This app's whole job is parsing files
         from strangers, which makes a CSP the highest-leverage control
         available: it is what stops a parser bug or a missed sanitizer from
         becoming code execution rather than a broken render.

         Each source list below is the narrowest the app actually runs with —
         see src/cspPolicy.spec.ts, which pins every allowance to the reason
         it exists and fails if this policy and index.html drift apart.

         Two limits worth knowing:
         - `frame-ancestors` is ignored in a <meta> CSP. Clickjacking
           protection needs a real response header at the host; this file
           cannot provide it, so serve `frame-ancestors 'none'` (or
           X-Frame-Options: DENY) wherever the app is deployed.
         - `style-src` keeps 'unsafe-inline'. Vite injects every SFC's
           <style scoped> as an inline <style> element in dev, and the editor
           canvas is styled per-run. The exposure it would otherwise buy back
           is small here: there is no HTML-injection sink in the codebase (no
           v-html, no innerHTML, no insertAdjacentHTML anywhere in src/), so
           an attacker has no way to place markup for it to act on.

         `frame-src` is blob:, not 'none', although the app has no iframes:
         Chromium hosts its built-in PDF viewer in a frame inside the
         <object> (components/media/MediaPdfEmbed.vue) and checks that frame
         against frame-src as well as object-src, so 'none' refused every PDF
         at /media/:id. blob: is all it takes — 'self' does not match a blob:
         URL and is not needed — and it lets a frame load nothing an <object>
         could not already, since object-src admits blob: too. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'sha256-W2FjQ5JZCp8eaN5g7RGFMW9+UKbI7FFzHad1AvSkTQE=';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        media-src 'self' data: blob:;
        object-src 'self' blob:;
        worker-src 'self' blob:;
        connect-src 'self' data: blob: https: ws: wss:;
        base-uri 'none';
        form-action 'none';
        frame-src blob:;
      "
    />
    <title>docu-edit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The design themes' faces (Modernist: Archivo, Nocturne: Inter,
         Industry: Barlow + Barlow Condensed).
         Loaded non-blocking (media="print" until loaded) with display=swap,
         so a slow or absent network never delays first paint: the --font-ui
         stacks in tokens.css fall back to the system grotesque. The swap to
         media="all" is wired from the script below rather than an
         `onload="..."` attribute: a CSP hash cannot cover an inline event
         handler (only 'unsafe-hashes' would, which is worth far more than
         this), so under SEC-6's policy the attribute was simply blocked and
         the faces never activated at all. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="webfonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
    />
    <!-- No-flash theme (SPEC-059 AC-5/57/58/59): the ONLY application logic in
         index.html. Runs before the app bundle and sets data-theme (and the
         design theme's data-palette) on <html> from the stored preference so
         the first paint is the right theme. Only an explicit "light"/"dark" is
         applied; "system" (or absent/unknown) leaves no attribute so the media
         query alone decides (AC-6) — and only a non-default palette is
         applied, so Modernist (the base :root palette) leaves no attribute
         either. Wrapped so a blocked localStorage (private mode, SPEC-003)
         never throws. SPEC-066 folds the theme into docu-edit:preferences;
         this reads that first and falls back to the pre-migration
         docu-edit:theme key so a user upgrading (whose legacy key the app has
         not yet migrated) still gets a flash-free first paint. -->
    <script>
      try {
        var t = null;
        var p = null;
        var raw = localStorage.getItem("docu-edit:preferences");
        if (raw) {
          try {
            var prefs = JSON.parse(raw);
            t = prefs.theme;
            p = prefs.palette;
          } catch (parseError) {}
        }
        if (t !== "light" && t !== "dark") {
          t = localStorage.getItem("docu-edit:theme");
        }
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
        if (typeof p === "string" && p !== "modernist" && /^[a-z-]+$/.test(p)) {
          document.documentElement.setAttribute("data-palette", p);
        }
      } catch (e) {}
      try {
        var f = document.getElementById("webfonts");
        if (f) {
          if (f.sheet) {
            f.media = "all";
          } else {
            f.addEventListener("load", function () {
              f.media = "all";
            });
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
